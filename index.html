<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechRead Ingress v2.0 | Production Grid</title>
    <!-- Lucide Icon Assets Core -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0d1527;
            --bg-code: #03060f;
            --accent-glow: #38bdf8;
            --accent-success: #34d399;
            --text-title: #f8fafc;
            --text-desc: #94a3b8;
            --border-insulated: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-title); line-height: 1.6; padding-bottom: 3rem; }
        
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-insulated); padding: 1.25rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo-block { display: flex; align-items: center; gap: 0.75rem; font-size: 1.5rem; font-weight: 800; color: var(--text-title); }
        .logo-block span { color: var(--accent-glow); }

        .track-navigator { max-width: 1400px; margin: 2rem auto 0 auto; padding: 0 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .insulated-card { background-color: var(--bg-card); border: 1px solid var(--border-insulated); border-radius: 12px; padding: 1.75rem; position: relative; transition: all 0.2s ease; }
        .track-card { cursor: pointer; display: flex; align-items: center; gap: 1rem; }
        .track-card.active { border-color: var(--accent-glow); box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }
        .track-icon { background: rgba(56, 189, 248, 0.1); color: var(--accent-glow); width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        .workspace-grid { max-width: 1400px; margin: 2.5rem auto; padding: 0 2rem; display: grid; grid-template-columns: 2fr 1.2fr; gap: 2.5rem; align-items: start; }
        .roadmap-container { display: flex; flex-direction: column; gap: 2rem; }
        .workbench-panel { display: flex; flex-direction: column; gap: 2rem; }
        
        .section-header { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .step-badge { position: absolute; top: 1.5rem; right: 2rem; font-size: 0.7rem; font-weight: 800; padding: 0.25rem 0.75rem; border-radius: 9999px; letter-spacing: 0.05em; text-transform: uppercase; }
        .badge-basic { background: rgba(52, 211, 153, 0.1); color: var(--accent-success); }
        .badge-prod { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .badge-adv { background: rgba(56, 189, 248, 0.1); color: var(--accent-glow); }
        
        .step-heading { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; padding-right: 6rem; }
        .step-meta { font-size: 0.85rem; color: var(--accent-glow); font-weight: 600; margin-bottom: 1rem; }
        .code-box { background-color: var(--bg-code); border-radius: 8px; padding: 1.25rem; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #e2e8f0; border: 1px solid #111827; overflow-x: auto; margin: 1rem 0; line-height: 1.5; }
        
        .verify-btn { width: 100%; background-color: var(--accent-success); color: var(--bg-main); border: none; padding: 0.85rem; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: opacity 0.2s; }
        .verify-btn:hover { opacity: 0.9; }

        /* AUTH ENTRIES STYLING */
        .auth-input { w-full; width: 100%; background-color: var(--bg-code); border: 1px solid var(--border-insulated); padding: 0.75rem; border-radius: 8px; color: var(--text-title); font-family: monospace; margin-top: 0.25rem; margin-bottom: 1rem; }
        .auth-input:focus { border-color: var(--accent-glow); outline: none; }
        .auth-grid-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem; }
        .btn-auth-action { padding: 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.25rem; transition: all 0.2s; }

        @media (max-width: 1024px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- NAV BAR -->
    <header>
        <div class="header-container">
            <div class="logo-block">
                <i data-lucide="shield-check"></i> TechRead<span>.Ingress</span>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-desc); font-weight: 600;">
                <i data-lucide="user" style="display:inline; width:14px; vertical-align:middle; color:var(--accent-success);"></i> Co-Founder & Principal Architect: Sudhir Kumar Mishra
            </div>
        </div>
    </header>

    <!-- MODULE 1: NAVIGATOR ROOT -->
    <section id="track-navigator-root" class="track-navigator"></section>

    <!-- MAIN GRID CONTAINER -->
    <main class="workspace-grid">
        <!-- MODULE 2: ROADMAP ROOT -->
        <section id="roadmap-ledger-root" class="roadmap-container"></section>
        
        <!-- MODULE 3 & 4 SIDEBAR CONTAINER -->
        <div class="workbench-panel">
            <!-- MODULE 3: WORKBENCH ROOT -->
            <section id="sandbox-workbench-root" style="display: flex; flex-direction: column; gap: 2rem;"></section>
        </div>
    </main>

    <!-- APPLICATION LAUNCHER INGRESS -->
    <script src="components/navigator.js"></script>
    <script src="components/roadmap.js"></script>
    <script src="components/workbench.js"></script>
    <script src="components/auth.js"></script>
    <!-- Supabase Client JavaScript Engine Integration -->
    <script src="https://jsdelivr.net"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("🤖 [Production Grid] Initializing Sudhir's Decoupled Micro-Modules...");
            
            // Execute all module injections synchronously into DOM Nodes
            if (typeof renderNavigator === "function") renderNavigator();
            if (typeof renderRoadmap === "function") renderRoadmap();
            
            // Render Module 4 (Auth Shield) directly inside the sidebar stack panel
            if (typeof renderAuthModule === "function") {
                renderAuthModule();
            } else if (typeof renderWorkbench === "function") {
                renderWorkbench();
            }
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
